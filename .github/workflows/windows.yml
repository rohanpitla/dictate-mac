# Tests Dictate for Windows on real Windows machines (standard and ARM).
#
# Installs it exactly as a user would (windows/install.ps1, Windows
# PowerShell 5.1), runs the self-test against the installed copy, starts the
# real app, then uninstalls it and checks nothing is left behind.

name: Windows

on:
  push:
    branches: [windows, main]
    paths: ["dictate/**", "dictate_win/**", "windows/**", "requirements-windows*", ".github/workflows/windows.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # least privilege: this workflow only reads the code

jobs:
  groq-models:
    # Groq retires models with a few weeks' notice; fail loudly when ours go.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Groq still serves our models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 windows/check_groq_models.py

  x64-parts:
    # windows-latest froze the whole machine during the full self-test.
    # Each group runs on its own machine; the one that never finishes is it.
    strategy:
      fail-fast: false
      matrix:
        part:
          - "imports settings taps resample groq cleanup"
          - "core"
          - "mic_process small"
          - "credentials clipboard"
          - "paste_into_app"
          - "hotkey"
          - "real_mic"
          - "mute"
          - "key_dialog"
          - "tray"
          - "local_engine"
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: |
          if ("${{ matrix.part }}" -eq "local_engine") {
            .\windows\install.ps1 -Source $PWD -WithLocal -NoLaunch -NoStartAtLogin
          } else {
            .\windows\install.ps1 -Source $PWD -NoLaunch -NoStartAtLogin
          }
      - name: Self-test part
        run: |
          $base = Join-Path $env:LOCALAPPDATA "Dictate"
          Push-Location (Join-Path $base "app")
          $ErrorActionPreference = "Continue"
          & (Join-Path $base "venv\Scripts\python.exe") -u -m dictate_win.selftest ${{ matrix.part }} 2>&1 |
            ForEach-Object { "$(Get-Date -Format HH:mm:ss) $_" }
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is tested in parts below until its freeze is found
        os: [windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, what testers have
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Machine
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "Windows $($os.Version) $($os.OSArchitecture), CPU: $((Get-CimInstance Win32_Processor).Name)"
          "PowerShell $($PSVersionTable.PSVersion)"
          try { "Defender real-time protection: $((Get-MpComputerStatus).RealTimeProtectionEnabled)" } catch { "Defender: unknown" }

      - name: Install (as a user would, plus the optional local engine)
        run: .\windows\install.ps1 -Source $PWD -WithLocal -NoLaunch -NoStartAtLogin

      - name: Self-test (installed copy)
        timeout-minutes: 20
        run: |
          $base = Join-Path $env:LOCALAPPDATA "Dictate"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $err = Join-Path $env:RUNNER_TEMP "selftest-err.txt"
          # Run in the background with a hard limit, so a hang still leaves
          # a log (a job killed at its time limit keeps no log at all).
          $p = Start-Process -FilePath (Join-Path $base "venv\Scripts\python.exe") `
                 -ArgumentList "-u -m dictate_win.selftest" `
                 -WorkingDirectory (Join-Path $base "app") -NoNewWindow -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $p.Handle  # without this, ExitCode can come back empty
          $finished = $p.WaitForExit(12 * 60 * 1000)
          if (-not $finished) {
            "=== SELF-TEST HUNG: still running after 12 minutes ==="
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*dictate*" } |
              ForEach-Object { "still running: pid $($_.ProcessId) $($_.CommandLine)" }
            & taskkill.exe /T /F /PID $p.Id 2>&1 | Out-Null
          }
          Get-Content $out
          "--- stderr ---"
          Get-Content $err
          $errText = Get-Content $err -Raw
          if ($errText) { Add-Content $out $errText }
          if (-not $finished) { exit 1 }
          exit $p.ExitCode

      - name: Start the real app
        run: |
          $base = Join-Path $env:LOCALAPPDATA "Dictate"
          $link = Join-Path ([Environment]::GetFolderPath("Programs")) "Dictate.lnk"
          if (-not (Test-Path $link)) { throw "Start menu shortcut missing" }
          Start-Process -FilePath (Join-Path $base "venv\Scripts\pythonw.exe") -ArgumentList "-m dictate_win" -WorkingDirectory (Join-Path $base "app")
          Start-Sleep -Seconds 20
          $log = Get-Content (Join-Path $base "logs\dictate.log") -Raw
          $log
          $running = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*-m dictate_win*" -and $_.CommandLine -notlike "*selftest*" }
          if (-not $running) { throw "Dictate is not running" }
          if ($log -notmatch "\[dictate\] ready") { throw "Dictate did not report ready" }
          if ($log -match "Traceback") { throw "Dictate logged an error" }
          "Memory (MB): " + [math]::Round((($running | ForEach-Object { (Get-Process -Id $_.ProcessId).WorkingSet64 }) | Measure-Object -Sum).Sum / 1MB)
          "Disk used (MB): " + [math]::Round(((Get-ChildItem $base -Recurse -File -Force | Measure-Object Length -Sum).Sum) / 1MB)
          $micChildren = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*mic_child*" }
          "Microphone processes waiting (mic off): $(@($micChildren).Count)"

      - name: Uninstall and check nothing is left
        run: |
          .\windows\uninstall.ps1 -Purge
          $base = Join-Path $env:LOCALAPPDATA "Dictate"
          if (Test-Path $base) { throw "the Dictate folder is still there" }
          foreach ($folder in @([Environment]::GetFolderPath("Programs"), [Environment]::GetFolderPath("Startup"))) {
            if (Test-Path (Join-Path $folder "Dictate.lnk")) { throw "a shortcut is still there" }
          }
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*dictate_win*" }
          if ($left) { throw "Dictate processes are still running" }
          if ((cmdkey /list) -match "Dictate/") { throw "a saved key is still there" }
          "Clean."

      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: selftest-${{ matrix.os }}
          path: ${{ runner.temp }}/selftest.txt
          if-no-files-found: ignore
